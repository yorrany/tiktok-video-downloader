<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="100%" stop-color="#ffb199"/>
    </linearGradient>
  </defs>

  <!-- iOS squircle background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="#25f4ee" stroke-width="4" stroke-opacity="0.3"/>

  <!-- TikTok style dual-offset layers for download mark -->
  <g transform="translate(136, 120)">
    <!-- Cyan glow offset -->
    <path d="M120 20 L120 160 M80 120 L120 165 L160 120 M40 180 L40 210 C40 220, 50 230, 60 230 L180 230 C190 230, 200 220, 200 210 L200 180" 
          fill="none" 
          stroke="#25F4EE" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          transform="translate(-6, -4)"/>

    <!-- Pink glow offset -->
    <path d="M120 20 L120 160 M80 120 L120 165 L160 120 M40 180 L40 210 C40 220, 50 230, 60 230 L180 230 C190 230, 200 220, 200 210 L200 180" 
          fill="none" 
          stroke="#FE2C55" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          transform="translate(6, 4)"/>

    <!-- Main crisp white layer -->
    <path d="M120 20 L120 160 M80 120 L120 165 L160 120 M40 180 L40 210 C40 220, 50 230, 60 230 L180 230 C190 230, 200 220, 200 210 L200 180" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>
